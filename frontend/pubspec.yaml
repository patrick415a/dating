name: dating_web
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_card_swiper: ^7.2.0
  image_picker: ^1.2.3
  daum_postcode_search: ^1.1.0
  flutter_inappwebview: ^6.1.5
  kpostal: ^2.0.0
  geolocator: ^14.0.3
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  kakao_flutter_sdk_user: ^1.9.5
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  licenses:
    - assets/fonts/pretendard/LICENSE.txt

  assets:
    - assets/audios/bgm.mp3

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/pretendard/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/pretendard/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/pretendard/Pretendard-Black.otf
          weight: 900
